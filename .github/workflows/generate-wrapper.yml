name: Generate Gradle Wrapper

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Ensure app module directory
        run: mkdir -p app

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Commit Wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper
          git diff --cached --quiet || git commit -m "build: add Gradle Wrapper"
          git push
